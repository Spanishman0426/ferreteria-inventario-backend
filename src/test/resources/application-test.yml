server:
  port: 8081

spring:
  application:
    name: ferreteria-inventario-backend-test

  datasource:
    url: jdbc:h2:mem:ferreteria_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

